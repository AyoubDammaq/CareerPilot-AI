server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # A CV is the largest upload (5 MB); keep a little room for the form envelope.
  client_max_body_size 7m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Backend upstream (docker compose service name "api", container port 8080)
  location /api/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI calls can take a while; anything slower than this is a hung request.
    proxy_read_timeout 120s;
  }

  location /health/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Hashed build assets: cache hard
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA history fallback; never cache the shell
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
