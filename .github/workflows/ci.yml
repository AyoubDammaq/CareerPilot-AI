name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careerpilot_test
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerpilot -d careerpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          set +e
          dotnet restore CareerPilot.slnx > restore.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error|NU[0-9]{4}" restore.log | sort -u | head -8 | while read -r line; do echo "::error title=RESTORE::${line:0:400}"; done
          fi
          exit $code
      - run: dotnet build CareerPilot.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/CareerPilot.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Integration tests (real PostgreSQL)
        env:
          CAREERPILOT_TEST_DB: Host=localhost;Port=5432;Database=careerpilot_test;Username=careerpilot;Password=careerpilot-ci
        run: dotnet test tests/CareerPilot.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"
      - name: Test summary (fails if anything was skipped or nothing ran)
        if: always()
        run: |
          for f in $(find . -name '*.trx'); do
            c=$(grep -o '<Counters [^>]*>' "$f")
            echo "::notice title=$(basename $f)::$c"
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for r in ET.parse(sys.argv[1]).getroot().iter():
              if r.tag.endswith('UnitTestResult') and r.get('outcome') == 'Failed':
                  m = ''.join(x.text or '' for x in r.iter() if x.tag.endswith('Message'))
                  print('::error title=FAILED TEST::%s :: %s' % (r.get('testName'), ' '.join(m.split())[:500]))
          PY
            echo "$c" | grep -q 'executed="0"' && { echo "No tests executed in $f"; exit 1; }
            echo "$c" | grep -qE 'notExecuted="[1-9]' && { echo "Skipped tests in $f"; exit 1; }
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Frontend (unit tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: Browser smoke test (production build, real Chromium, the same security policy nginx sends)
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 e2e/smoke.py

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/CareerPilot.API/Dockerfile -t careerpilot-api .
      - run: docker build -t careerpilot-web ./web
      - name: Compose file is valid
        run: |
          POSTGRES_PASSWORD=x AUTH_PASSWORD=a-long-enough-password AUTH_JWT_KEY=a-signing-key-that-is-at-least-32-chars docker compose config > /dev/null
      - name: Web server config is valid and every location sends the security headers
        run: |
          docker run --rm --add-host api:127.0.0.1 careerpilot-web nginx -t
          docker run -d --name web --add-host api:127.0.0.1 -p 8081:80 careerpilot-web
          sleep 3
          fail=0
          for path in / /missing-page /main.js /api/anything /health/live; do
            h=$(curl -s -D - -o /dev/null "http://127.0.0.1:8081$path")
            for name in x-content-type-options x-frame-options referrer-policy content-security-policy permissions-policy; do
              echo "$h" | grep -qi "^$name:" || { echo "::error title=HEADERS::$path is missing $name"; fail=1; }
            done
          done
          echo "$(curl -s -D - -o /dev/null http://127.0.0.1:8081/)" | grep -qi '^server: nginx/' && echo "::warning title=HEADERS::server version is shown"
          docker rm -f web > /dev/null
          exit $fail

  supply-chain:
    name: Secrets and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials committed
        run: |
          if git grep -nIE 'sk-ant-[A-Za-z0-9_-]{20,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}' -- . ':!web/package-lock.json'; then
            echo "::error title=SECRET::A credential-shaped string is committed (see the lines above). Remove it and rotate the credential."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error title=SECRET::A .env file is committed."; exit 1; fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Known vulnerabilities in NuGet packages (reported; does not block)
        run: |
          dotnet list CareerPilot.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "::warning title=NUGET VULNERABILITY::Vulnerable packages found. See the job log."; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Known vulnerabilities in npm packages that ship to the browser (reported; does not block)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high || echo "::warning title=NPM VULNERABILITY::npm audit found high or critical issues. See the job log."
