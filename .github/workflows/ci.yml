name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: careerpilot_test
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerpilot -d careerpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CareerPilot.slnx
      - run: dotnet build CareerPilot.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/CareerPilot.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Integration tests (real PostgreSQL)
        env:
          CAREERPILOT_TEST_DB: Host=localhost;Port=5432;Database=careerpilot_test;Username=careerpilot;Password=careerpilot-ci
        run: dotnet test tests/CareerPilot.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"
      - name: Test summary (fails if anything was skipped or nothing ran)
        if: always()
        run: |
          for f in $(find . -name '*.trx'); do
            c=$(grep -o '<Counters [^>]*>' "$f")
            echo "::notice title=$(basename $f)::$c"
            echo "$c" | grep -q 'executed="0"' && { echo "No tests executed in $f"; exit 1; }
            echo "$c" | grep -qE 'notExecuted="[1-9]' && { echo "Skipped tests in $f"; exit 1; }
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Frontend (unit tests + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/CareerPilot.API/Dockerfile -t careerpilot-api .
      - run: docker build -t careerpilot-web ./web
