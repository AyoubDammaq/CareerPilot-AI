name: Generate EF migration

# Run manually (Actions tab -> Generate EF migration). It creates the migration for the current
# model and commits it to the branch under
# src/CareerPilot.Infrastructure/Persistence/Migrations. No database is needed.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name
        required: true
        default: InitialCreate

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef
      - run: dotnet restore CareerPilot.slnx
      - name: Add migration
        run: >
          dotnet ef migrations add "${{ inputs.name }}"
          --project src/CareerPilot.Infrastructure
          --startup-project src/CareerPilot.API
          --output-dir Persistence/Migrations
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CareerPilot.Infrastructure/Persistence/Migrations
          git commit -m "Add EF migration ${{ inputs.name }}"
          git push
